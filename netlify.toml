[build]
  command = "hugo --gc --minify -b $URL"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.83.1"
  HUGO_ENABLEGITINFO = "true"

[context.production.environment]
  HUGO_ENV = "production"

[context.deploy-preview]
  command = "hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "hugo --gc --minify -b $DEPLOY_PRIME_URL"

[[plugins]]
  package = "netlify-plugin-hugo-cache-resources"
  [plugins.inputs]
    debug = true

# Preserve existing publication and attachment links.
[[redirects]]
  from = "/publication/osafoagyare-bayes-2020/*"
  to = "/publication/road-accident-injury-severity/:splat"
  status = 301

# Preserve existing publication and attachment links.
[[redirects]]
  from = "/publication/osafoagyare-expectile-factorization-2024/*"
  to = "/publication/bootstrap-home-prices/:splat"
  status = 301
