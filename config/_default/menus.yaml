# Navigation Links
#   To link a homepage widget, specify the URL as a hash `#` followed by the filename of the
#     desired widget in your `content/home/` folder.
#   The weight parameter defines the order that the links will appear in.

main:
  - name: Home
    url: '/'
    weight: 10
  - name: Research
    url: '#reports'
    weight: 20
  - name: Publications
    url: '#featured'
    weight: 30
  - name: Awards
    url: '#accomplishments'
    weight: 40
  - name: Talks
    url: '/talk/'
    weight: 50
  - name: Contact
    url: '#contact'
    weight: 60

  # Miscellaneous dropdown (personal pages, kept off to the side of the CV content).
  - name: Miscellaneous
    url: '/miscellaneous/'
    weight: 70
  - name: Family
    url: '/miscellaneous/family/'
    weight: 10
    parent: Miscellaneous
  - name: Gallery
    url: '/miscellaneous/gallery/'
    weight: 20
    parent: Miscellaneous
  - name: Fun Memories
    url: '/miscellaneous/fun-memories/'
    weight: 30
    parent: Miscellaneous

# Link to a PDF of your resume/CV from the menu.
# To enable, copy your resume/CV to `static/uploads/resume.pdf` and uncomment the lines below.
  - name: Resume
    url: uploads/cv.pdf
    weight: 100
